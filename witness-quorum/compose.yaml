name: witness-quorum
services:
  witness-1:
    build: .
    image: witness-quorum:research
    command: ["--root", "/runtime", "--id", "1", "--engine", "/app/bin/witness-engine"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs: [/tmp:size=32m]
    volumes:
      - ./runtime/docker/genesis.json:/runtime/genesis.json:ro
      - ./runtime/docker/admin.pub:/runtime/admin.pub:ro
      - ./runtime/docker/secrets/node-1.json:/runtime/secrets/node-1.json:ro
      - ./runtime/docker/data/node-1:/runtime/data/node-1
    networks: [witness]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',10101),2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
